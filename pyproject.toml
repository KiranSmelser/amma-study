[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amma-study-pipeline"
version = "0.4.0"
description = "Reproducible preprocessing pipeline for Amma study exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boxsdk>=10,<11",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
amma-pipeline = "amma_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
